# Prod stack — Go rebuild.
#
# NOT actually deployed during Phase F. This file exists so the compose
# spec is versioned alongside the dev spec and so `docker compose config`
# validates cleanly. Actual prod bring-up waits for Phase C cutover.
#
# Phase F caveat: the Go binaries currently just print "hello from
# <binary>" and exit. `restart: "no"` is set on all four Go services
# below so that starting this stack during Phase F doesn't crashloop.
# Flip to `restart: unless-stopped` in Phase S once real code runs a
# blocking event loop.

name: found-footy-prod

volumes:
  postgres-data:
  temporal-postgres-data:
  garage-data:
  garage-meta:
  twitter-profiles:      # shared across headless twitter replicas
  twitter-vnc-profile:   # dedicated to the twitter-vnc container (per T/b.4)

networks:
  found-footy-prod:
    driver: bridge
  proxy:
    external: true
  luv-prod:
    external: true

services:
  # ────── Infrastructure ──────

  postgres:
    image: postgres:16-alpine
    container_name: found-footy-prod-postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: found_footy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - found-footy-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d found_footy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16-alpine
    container_name: found-footy-prod-temporal-postgres
    environment:
      POSTGRES_USER: ${TEMPORAL_PG_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - found-footy-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_PG_USER} -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: found-footy-prod-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_PG_USER}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
    networks:
      - found-footy-prod
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.30.3
    container_name: found-footy-prod-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    networks:
      - found-footy-prod
      - proxy
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: found-footy-prod-garage
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.prod.toml:/etc/garage.toml:ro
    networks:
      - found-footy-prod
    restart: unless-stopped

  # ────── Go binaries ──────
  # container_name deliberately omitted on scaled services (worker,
  # twitter) — compose rejects container_name + deploy.replicas.
  # Auto-naming: found-footy-prod-worker-1, -worker-2, etc.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: worker
    image: found-footy-worker:latest
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-prod-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      garage:
        condition: service_started
    volumes:
      - ~/workspace/nats/creds/found-footy-prod.creds:/etc/nats/found-footy.creds:ro
    networks:
      - found-footy-prod
      - luv-prod
    deploy:
      replicas: 2  # scaler adjusts between 2 and 8 at runtime
    restart: "no"  # Phase F only — flip to unless-stopped in Phase S

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: api
    image: found-footy-api:latest
    container_name: found-footy-prod-api
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-prod-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/workspace/nats/creds/found-footy-prod.creds:/etc/nats/found-footy.creds:ro
    networks:
      - found-footy-prod
      - proxy
      - luv-prod
    restart: "no"  # Phase F only — flip to unless-stopped in Phase S

  scaler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: scaler
    image: found-footy-scaler:latest
    container_name: found-footy-prod-scaler
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - found-footy-prod
    restart: "no"  # Phase F only — flip to unless-stopped in Phase S

  # Headless twitter scrapers. Multi-instance — scaler adjusts replicas
  # between 2 and 8 at runtime based on active-goal count. Cookies
  # shared with twitter-vnc via the twitter-cookies bind mount.
  twitter:
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
    image: found-footy-prod-twitter:latest
    env_file: .env
    environment:
      # /authenticate response points operators at the VNC container.
      # These get baked into the reauth message so operators see the
      # exact command + URL to click.
      TWITTER_VNC_URL: http://found-footy-prod-twitter-vnc.luv
      TWITTER_VNC_START_CMD: "docker compose --profile vnc up -d twitter-vnc"
      # Not the VNC container — leave headless-mode default (true) alone.
    # Playwright headless in Docker: Firefox sandbox needs relaxed
    # seccomp for its clone3()/unshare() user-namespace calls, plus
    # more /dev/shm than Docker's 64MB default for the renderer's
    # shared memory. Both apply here even in headless mode.
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      - twitter-profiles:/data
      - ~/.config/found-footy/twitter_cookies.json:/config/twitter_cookies.json
    networks:
      - found-footy-prod
    deploy:
      replicas: 2  # scaler adjusts between 2 and 8 at runtime
    restart: "no"  # Phase F only — flip to unless-stopped in Phase S

  # Cookie re-auth container — opt-in via the `vnc` profile:
  #   docker compose --profile vnc up -d twitter-vnc
  # Runs the same twitter binary but with Playwright non-headless
  # (TWITTER_VNC_MODE=true triggers entrypoint.sh to start Xvfb +
  # fluxbox + x11vnc + websockify+noVNC). Operator opens noVNC in a
  # browser at found-footy-prod-twitter-vnc.luv, logs in, cookies
  # land in the shared file, headless fleet picks them up on next
  # mtime check.
  #
  # Shares the same cookie file with headless; separate profile
  # volume (twitter-vnc-profile) so the visible-display Firefox's
  # profile state doesn't collide with headless SQLite writes.
  twitter-vnc:
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
      args:
        WITH_VNC: "true"
    image: found-footy-prod-twitter-vnc:latest
    container_name: found-footy-prod-twitter-vnc
    profiles: [vnc]
    env_file: .env
    environment:
      TWITTER_VNC_MODE: "true"       # triggers entrypoint's VNC stack
      TWITTER_HEADLESS: "false"      # Playwright uses the Xvfb display
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      - twitter-vnc-profile:/data
      - ~/.config/found-footy/twitter_cookies.json:/config/twitter_cookies.json
    networks:
      - found-footy-prod
      - proxy                        # Caddy fronts noVNC:6080
    restart: "no"
