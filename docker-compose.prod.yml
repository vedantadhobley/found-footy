# Prod stack — Go rebuild. LIVE deployment target (La Liga cutover).
#
# Deploy with:
#   make deploy-prod
# The release command stamps and verifies one immutable source identity across
# worker, API, static Twitter, optional VNC, and future fleet instances.
#
# Runs the real Go binaries (worker/api built from ./Dockerfile). The
# #160 per-event Firefox fleet is on (FIREFOXFLEET_ENABLED=true in .env):
# the worker provisions one twitter instance per goal via the Docker API,
# so it mounts docker.sock and the static `twitter` service below is just
# the fleet's image-builder + nominal fallback (single instance).
#
# Opt-in service, excluded from a plain `up`:
#   twitter-vnc — profiles: [vnc]; cookie re-auth via noVNC

name: found-footy-prod

volumes:
  postgres-data:
  temporal-postgres-data:
  garage-data:
  garage-meta:
  twitter-vnc-profile:   # dedicated to the twitter-vnc container (per T/b.4)
  # NOTE: headless twitter's Firefox profile lives in the container's
  # writable layer, NOT a shared volume — matches Python-shape ephemeral
  # profiles. Firefox refuses to run two processes against the same
  # profile dir (.parentlock guard), so sharing across replicas would
  # crash all but the first. See decisions.md 2026-07-23.

networks:
  found-footy-prod:
    name: found-footy-prod     # explicit — matches Python prod; else Compose derives found-footy-prod_found-footy-prod
    driver: bridge
  proxy:
    external: true
  luv-prod:
    external: true

services:
  # ────── Infrastructure ──────

  postgres:
    # pgvector/pgvector:pg16 = Postgres 16 + pgvector, matching dev + the
    # testcontainer base (pool_test.go). The live schema only needs pgcrypto
    # (bundled everywhere); pgvector is currently unused but kept for
    # dev/prod/test parity — see the vestigial-pgvector cleanup note.
    image: pgvector/pgvector:pg16
    container_name: found-footy-prod-postgres
    mem_limit: 4g  # host-budget ceiling per ~/.claude/CLAUDE.md — hard host-protection cap
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: found_footy
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema bootstrap: Postgres applies /docker-entrypoint-initdb.d/*.sql
      # once on a fresh data dir (mirrors dev). The Go app only VERIFIES the
      # schema-hash at boot — it never creates the schema — so this mount is
      # REQUIRED or worker/api refuse to start. Reprovision = wipe the volume.
      - ./internal/infra/pg/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - found-footy-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d found_footy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16-alpine
    container_name: found-footy-prod-temporal-postgres
    mem_limit: 2g  # host-budget ceiling (see postgres note); low-traffic metadata store
    environment:
      POSTGRES_USER: ${TEMPORAL_PG_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - found-footy-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_PG_USER} -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: found-footy-prod-temporal
    mem_limit: 2g  # host-budget ceiling (see postgres note)
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_PG_USER}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
    networks:
      - found-footy-prod
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.30.3
    container_name: found-footy-prod-temporal-ui
    mem_limit: 1g  # host-budget ceiling (see postgres note); tiny web UI
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    networks:
      - found-footy-prod
      - proxy
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: found-footy-prod-garage
    mem_limit: 2g  # host-budget ceiling (see postgres note)
    # Secrets injected from .env — one secret-free garage.toml serves dev + prod
    # (no per-env file). Garage reads GARAGE_* when the TOML keys are absent.
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - found-footy-prod
      - luv-prod  # shared door: vs-prod-api re-proxies presigned video URLs (host 'garage:3900')
    restart: unless-stopped

  # ────── Go binaries ──────
  # container_name deliberately omitted on `worker` — compose rejects
  # container_name + deploy.replicas. Auto-naming: found-footy-prod-worker-1,
  # -worker-2. (twitter is single now — the #160 fleet handles per-event load.)

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: worker
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: found-footy-worker:${IMAGE_TAG:-latest}
    mem_limit: 16g  # host-budget ceiling; ffmpeg dense-extract is memory-heavy (per-replica cap, not reservation)
    # #160 fleet: the prod image runs as non-root `app`, so grant the host
    # docker group (gid 984 on luv) to reach /var/run/docker.sock. Without this
    # every Provision/Release/ReapFirefox fails "permission denied" and no clip
    # is ever searched. (luv-specific gid — parameterize if prod ever moves host.)
    group_add: ["984"]
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-prod-worker
      EVENT_ENV: prod                                     # NATS subject token (found-footy.prod.*) + envelope source stamp
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      FIREFOXFLEET_IMAGE: found-footy-prod-twitter:${IMAGE_TAG:-latest} # exact release image the fleet spawns
      FIREFOXFLEET_NETWORK: found-footy-prod              # prod network the fleet attaches to (code default is dev's)
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      garage:
        condition: service_started
    volumes:
      # #160 per-event Firefox fleet — the worker provisions/releases one
      # twitter instance per event via the Docker API (FIREFOXFLEET_ENABLED
      # =true in .env). This is NOT a NATS creds mount: the bus is
      # unauthenticated (NATS_CREDS_FILE empty); account auth is a later add.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - found-footy-prod
      - luv-prod
    deploy:
      replicas: 2  # HA — Temporal distributes tasks across both; workers are stateless
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: api
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: found-footy-api:${IMAGE_TAG:-latest}
    container_name: found-footy-prod-api
    mem_limit: 2g  # host-budget ceiling (see postgres note); Go HTTP/SSE, tiny at rest
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-prod-api
      EVENT_ENV: prod  # must match the worker, else the api's live-feed subject diverges to found-footy.dev.*
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - found-footy-prod
      - proxy
      - luv-prod
    restart: unless-stopped

  # Static headless twitter — SINGLE instance (matches dev). In the #160
  # per-event fleet model this is the image the fleet spawns from + the
  # nominal fallback; per-event instances carry the real search load.
  # Cookies shared with twitter-vnc via the twitter-cookies bind mount.
  twitter:
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: found-footy-prod-twitter:${IMAGE_TAG:-latest}
    container_name: found-footy-prod-twitter
    mem_limit: 8g  # host-budget ceiling; Firefox is memory-heavy
    env_file: .env
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      # /authenticate response points operators at the VNC container.
      # These get baked into the reauth message so operators see the
      # exact command + URL to click.
      TWITTER_VNC_URL: http://found-footy-prod-twitter-vnc.luv
      TWITTER_VNC_START_CMD: "docker compose --profile vnc up -d twitter-vnc"
      # Not the VNC container — leave headless-mode default (true) alone.
    # Playwright headless in Docker: Firefox sandbox needs relaxed
    # seccomp for its clone3()/unshare() user-namespace calls, plus
    # more /dev/shm than Docker's 64MB default for the renderer's
    # shared memory. Both apply here even in headless mode.
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      # NOTE (decisions.md 2026-07-23): headless Firefox profile lives
      # in the container's writable layer, NOT a shared volume — no
      # cross-replica SQLite locking.
      - ~/.config/found-footy:/config  # mount the DIR, not the file — atomic cookie rename() EBUSYs on a single-file mountpoint
    networks:
      - found-footy-prod
    restart: unless-stopped

  # Cookie re-auth container — opt-in via the `vnc` profile:
  #   docker compose --profile vnc up -d twitter-vnc
  # Runs the same twitter binary but with Playwright non-headless
  # (TWITTER_VNC_MODE=true triggers entrypoint.sh to start Xvfb +
  # fluxbox + x11vnc + websockify+noVNC). Operator opens noVNC in a
  # browser at found-footy-prod-twitter-vnc.luv, logs in, cookies
  # land in the shared file, headless fleet picks them up on next
  # mtime check.
  #
  # Shares the same cookie file with headless; separate profile
  # volume (twitter-vnc-profile) so the visible-display Firefox's
  # profile state doesn't collide with headless SQLite writes.
  twitter-vnc:
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
      args:
        WITH_VNC: "true"
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: found-footy-prod-twitter-vnc:${IMAGE_TAG:-latest}
    container_name: found-footy-prod-twitter-vnc
    mem_limit: 8g  # host-budget ceiling (see twitter note); same Firefox shape + VNC stack
    profiles: [vnc]
    env_file: .env
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      TWITTER_VNC_MODE: "true"       # triggers entrypoint's VNC stack
      TWITTER_HEADLESS: "false"      # Playwright uses the Xvfb display
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      - twitter-vnc-profile:/data
      - ~/.config/found-footy:/config  # mount the DIR, not the file — atomic cookie rename() EBUSYs on a single-file mountpoint
    networks:
      - found-footy-prod
      - proxy                        # Caddy fronts noVNC:6080
    restart: "no"
