# Dev stack — Go rebuild.
#
# Every Go binary (worker, api, scaler, twitter) uses Dockerfile.dev with
# air for hot-reload. Source is bind-mounted at /src so edit-save-reload
# happens in ~2 seconds. All infra containers (postgres, temporal,
# garage) share the same dev network and speak service-name DNS.
#
# HTTP services fronted by workspace Caddy at:
#   found-footy-dev-api.luv           → api:8081  (Chi read surface; :8080 is internal metrics)
#   found-footy-dev-temporal-ui.luv   → temporal-ui:8080
#   found-footy-dev-garage-web.luv    → garage-web:3902 (if enabled)
#   found-footy-dev-twitter-vnc.luv   → twitter-vnc:6080  (opt-in via `vnc` profile)
#
# Only host port published: temporal gRPC 7233 for host-side dev clients.

name: found-footy-dev

# ────── shared named volumes for Go module + build cache ──────
# air rebuilds inside the container; without a persistent GOCACHE +
# GOMODCACHE, every restart would re-download modules. These live in
# named docker volumes shared across worker/api/scaler/twitter dev
# containers. `make clean` (or `docker volume rm found-footy-dev_...`)
# clears them.
volumes:
  go-cache:
  go-mod-cache:
  postgres-data:
  temporal-postgres-data:
  garage-data:
  garage-meta:
  twitter-vnc-profile:   # dedicated to twitter-vnc (opt-in `vnc` profile)
  # NOTE: headless twitter's Firefox profile lives in the container's
  # writable layer, NOT a shared volume — matches Python-shape ephemeral
  # profiles. Firefox refuses to run two processes against the same
  # profile dir (.parentlock guard), so sharing across replicas would
  # crash all but the first. See decisions.md 2026-07-23.

networks:
  found-footy-dev:
    name: found-footy-dev      # explicit — else Compose derives found-footy-dev_found-footy-dev
    driver: bridge
  proxy:
    external: true
  luv-dev:
    external: true

services:
  # ────── App Postgres (fixtures, events, videos, event_log, etc.) ──────
  postgres:
    # pgvector/pgvector:pg16 = official Postgres 16 with the `vector`
    # extension preinstalled. pg_trgm + pgcrypto are bundled with every
    # Postgres image; only pgvector needs the alternate base.
    image: pgvector/pgvector:pg16
    container_name: found-footy-dev-postgres
    # mem_limit: hard host-protection ceiling per the ~/.claude/CLAUDE.md
    # host memory-budget rule (this box runs several projects' stacks; no
    # container may eat the 125 GB during a leak/runaway). These are
    # circuit-breakers well above real peak, not efficiency targets — see
    # the found-footy row in vedanta-dhobley/docs/memory-budget.md. Dev
    # baseline for app Postgres.
    mem_limit: 4g
    environment:
      POSTGRES_USER: ${PG_USER:-ffuser}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ffpass}
      POSTGRES_DB: found_footy
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Schema bootstrap: Postgres runs /docker-entrypoint-initdb.d/*.sql
      # once on first startup with an empty data dir. Wipe the volume
      # (`docker volume rm found-footy-dev_postgres-data`) to re-provision.
      - ./internal/infra/pg/schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - found-footy-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ffuser} -d found_footy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ────── Temporal metadata Postgres (separate from app pg per §10) ──────
  temporal-postgres:
    image: postgres:16-alpine
    container_name: found-footy-dev-temporal-postgres
    mem_limit: 2g  # host-budget ceiling (see postgres note); low-traffic metadata store
    environment:
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - found-footy-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_PG_USER:-temporal} -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ────── Temporal server (workflow orchestration) ──────
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: found-footy-dev-temporal
    mem_limit: 2g  # host-budget ceiling (see postgres note)
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${TEMPORAL_PG_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"  # gRPC — published for host-side dev clients (§10 exception)
    networks:
      - found-footy-dev
    restart: unless-stopped

  # ────── Temporal Web UI ──────
  temporal-ui:
    image: temporalio/ui:2.30.3
    container_name: found-footy-dev-temporal-ui
    mem_limit: 1g  # host-budget ceiling (see postgres note); tiny web UI
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    networks:
      - found-footy-dev
      - proxy
    restart: unless-stopped

  # ────── Garage — S3-compatible blob storage ──────
  garage:
    image: dxflrs/garage:v1.0.1
    container_name: found-footy-dev-garage
    mem_limit: 2g  # host-budget ceiling (see postgres note)
    # Secrets injected from .env — one secret-free garage.toml serves dev + prod
    # (no per-env file). Garage reads GARAGE_* when the TOML keys are absent.
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - found-footy-dev
      - luv-dev  # shared door: cross-project consumers (vs-api) re-proxy presigned video URLs (host 'garage:3900')
    restart: unless-stopped

  # ────── Go: worker (Temporal worker) ──────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BINARY: worker
    image: found-footy-dev-worker:latest
    container_name: found-footy-dev-worker
    # Largest app ceiling. The worker runs concurrent ffmpeg frame-extraction;
    # streamed dense extraction (per-clip Go heap ~nil — hashes each frame as it
    # arrives) leaves ffmpeg RSS (~0.5g worst-case 1080p) as the only per-clip
    # cost. Concurrency is bounded by FFMPEG_MAX_CONCURRENT (.env, 32) → worst
    # case 32 × ~0.5g ≈ 16g, so 16g is the coupled ceiling. A rare all-worst-case
    # flurry degrades gracefully: an OOM-killed ffmpeg child just fails its
    # activity and Temporal retries. Load test + coupling: decisions.md
    # 2026-08-06. See postgres note.
    mem_limit: 16g
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-dev-worker
      # Compose owns the deployment partition. The fleet treats this network
      # as an opaque scope; it does not branch on a dev/prod environment value.
      FIREFOXFLEET_NETWORK: found-footy-dev
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - .:/src                                     # bind mount for air hot-reload
      - go-cache:/gocache
      - go-mod-cache:/gomodcache
      # #160 per-event Firefox fleet — Docker socket so the worker can
      # provision/release one twitter/Firefox container per searchable event
      # via the Docker API (internal/infra/firefoxfleet). Root-equivalent
      # access, scoped to this dev worker; the fleet is constructed only
      # when FIREFOXFLEET_ENABLED=true (default false → this mount sits
      # unused). Bind sources for provisioned instances resolve on the
      # host, which is why FIREFOXFLEET_COOKIE_HOST_PATH is a host path.
      - /var/run/docker.sock:/var/run/docker.sock
      # NATS creds mount removed 2026-07-07: workspace NATS runs no-auth
      # (accounts section commented in ~/workspace/nats/nats.conf). Re-add
      # when nsc-generated creds land + accounts are wired.
    networks:
      - found-footy-dev
      - luv-dev  # workspace NATS + cross-project HTTP
    restart: unless-stopped

  # ────── Go: api (HTTP + SSE + webhook delivery) ──────
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BINARY: api
    image: found-footy-dev-api:latest
    container_name: found-footy-dev-api
    mem_limit: 2g  # host-budget ceiling (see postgres note); Go HTTP/SSE, tiny at rest
    env_file: .env
    environment:
      NATS_CLIENT_NAME: found-footy-dev-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/src
      - go-cache:/gocache
      - go-mod-cache:/gomodcache
      # NATS creds mount removed 2026-07-07: workspace NATS runs no-auth
      # (accounts section commented in ~/workspace/nats/nats.conf). Re-add
      # when nsc-generated creds land + accounts are wired.
    networks:
      - found-footy-dev
      - proxy       # Caddy-fronted
      - luv-dev     # workspace NATS + vedanta-systems dev
    restart: unless-stopped

  # ────── Go: twitter (Playwright browser automation) ──────
  # Dev twitter runs headless — same as prod. VNC container is opt-in
  # via the `vnc` compose profile below (matches prod's shape per
  # decisions.md 2026-07-22, VNC-opt-in reconciliation).
  twitter:
    # Reconciled 2026-07-22 to use the merged docker/twitter/Dockerfile
    # (Playwright base + driver install + optional WITH_VNC layer);
    # the top-level Dockerfile is worker/api/scaler-only.
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
    image: found-footy-dev-twitter:latest
    container_name: found-footy-dev-twitter
    env_file: .env
    # Firefox is the one real memory consumer. With the cache-bounding prefs
    # (cmd/twitter/main.go) a long-lived instance should stay well under 2g;
    # 8g is generous headroom so normal work never chokes. NOTE: hitting
    # this limit can OOM-kill Firefox below Go PID 1. FF-017 makes Firefox a
    # critical child: the service reports failed health, exits non-zero, and
    # Compose restarts the complete Playwright unit. This remains a circuit
    # breaker, not routine memory management. #160's per-event instances set
    # their own per-instance cap at provision time. See postgres note.
    mem_limit: 8g
    # Firefox sandbox needs relaxed seccomp — its clone3()/unshare()
    # calls for user-namespace creation are blocked by Docker's default
    # seccomp profile, surfacing as "CanCreateUserNamespace clone()
    # failure: EPERM" at browser launch. Standard Playwright-in-Docker
    # workaround; safe here because the browser is the only untrusted
    # code in the container.
    security_opt:
      - seccomp:unconfined
    # /dev/shm defaults to 64MB in Docker; Firefox needs more (browser
    # rendering + shared memory across processes). --ipc=host would
    # work too but is more permissive; shm_size is scoped.
    shm_size: 1gb
    environment:
      TWITTER_HEADLESS: "true"
      # /authenticate response points operators at the (opt-in) VNC
      # container. Baked into the reauth message so operators see the
      # exact command + URL to click.
      TWITTER_VNC_URL: http://found-footy-dev-twitter-vnc.luv
      TWITTER_VNC_START_CMD: "docker compose -f docker-compose.dev.yml --profile vnc up -d twitter-vnc"
    volumes:
      # Cookie backup file — shared with twitter-vnc. Read-write so
      # the service can save refreshed cookies mid-session (per
      # twitter-spec §2). Bind mount to host so it survives full
      # docker-compose down + volume prune.
      #
      # NOTE (decisions.md 2026-07-23): headless twitter's Firefox
      # profile lives in the container's writable layer, NOT a shared
      # volume. Firefox's .parentlock guard would refuse to start
      # replicas 2+ if all mounted the same profile dir.
      - ~/.config/found-footy/twitter_cookies.json:/config/twitter_cookies.json
    networks:
      - found-footy-dev
    restart: unless-stopped

  # ────── Go: twitter-vnc (manual cookie re-auth container) ──────
  # Opt-in only. Started via:
  #   docker compose -f docker-compose.dev.yml --profile vnc up -d twitter-vnc
  # or via `make twitter-vnc-up`. Same twitter binary; entrypoint
  # boots Xvfb + fluxbox + x11vnc + websockify+noVNC because
  # TWITTER_VNC_MODE=true, Playwright renders into the visible display.
  # Operator opens noVNC via found-footy-dev-twitter-vnc.luv, logs in,
  # cookies land in the shared file, headless picks up via mtime.
  twitter-vnc:
    build:
      context: .
      dockerfile: docker/twitter/Dockerfile
      args:
        WITH_VNC: "true"
    image: found-footy-dev-twitter-vnc:latest
    container_name: found-footy-dev-twitter-vnc
    profiles: [vnc]
    mem_limit: 8g  # host-budget ceiling (see twitter note); same Firefox shape + VNC stack
    env_file: .env
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    environment:
      TWITTER_VNC_MODE: "true"       # entrypoint boots the VNC stack
      TWITTER_HEADLESS: "false"      # Playwright uses the Xvfb display
    volumes:
      # Separate profile dir from headless — visible Firefox's SQLite
      # writes shouldn't race with the headless Playwright context.
      - twitter-vnc-profile:/data
      - ~/.config/found-footy/twitter_cookies.json:/config/twitter_cookies.json
    networks:
      - found-footy-dev
      - proxy       # Caddy fronts noVNC:6080 as twitter-vnc.luv
    restart: "no"   # opt-in service; operator controls its lifecycle

  # Scaler is NOT included in dev. Auto-scaling only makes sense
  # when you have replicas to scale; dev runs one of each service.
