name: fault-terminal-grace-api-failure
description: |
  A fixture has reached the one-hour grace boundary, but the current provider
  request fails. The persisted observation remains intact and the fixture does
  not complete without a fresh terminal response.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999063
      state: active
      kickoff: 2026-08-25T18:00:00Z
      activated_at: 2026-08-25T17:55:00Z
      terminal_observed_at: 2026-08-25T20:00:00Z
      last_polled_at: 2026-08-25T20:59:30Z
      api_status_short: ft
      api_status_long: Match Finished
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

_terminal: &terminal
  fixtures:
    - id: 999063
      kickoff: 2026-08-25T18:00:00Z
      status_short: FT
      status_long: Match Finished
      status_elapsed: 90
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      goals_home: 0
      goals_away: 0

cycles:
  - t: 2026-08-25T21:00:00Z
    api_responses: {fixtures_by_ids: *terminal}
    api_fault:
      status_code: 500
      attempts: -1

expected_final_state:
  fixtures:
    - id: 999063
      state: active
      api_status_short: ft
      has_completed_at: false
      has_terminal_observed_at: true
      has_last_polled_at: true
