name: debounce-multiple-goals
description: |
  Real matches have multiple goals per fixture. Each goal has its own
  natural_key and gets its own INDEPENDENT debounce state — one goal
  triggering doesn't affect another, one goal being overturned by VAR
  doesn't touch the other.

  Trace: Two goals from DIFFERENT players on the same team.
    Cycle 1: goal A (Salah, min 30) detected → count_A=1
    Cycle 2: A still present + goal B (Nunez, min 40) detected →
             count_A=2, count_B=1
    Cycle 3: both present → count_A=3 (A triggers!), count_B=2
    Cycle 4: A vanishes (VAR), B still present → count_A=2, count_B=3
             (B triggers!)
    Cycle 5: A still absent, B still present → count_A=1, count_B=3
    Cycle 6: A back, B still present → count_A=2, count_B=3
    Cycle 7: A back, B still present → count_A=3 (A re-caps, no retrigger)

  Verifies: independence of debounce state per event, natural_key
  disambiguation, seq assignment order matching Python's chronological
  iteration.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999004
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1H"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

# Base fixture envelope — events swapped per cycle.
_base_fixture: &base_fixture
  id: 999004
  kickoff: 2026-07-08T15:00:00Z
  status_short: "1H"
  status_long: First Half
  status_elapsed: 40
  home_id: 40
  home_name: Liverpool
  away_id: 42
  away_name: Arsenal
  league_id: 39
  league_name: Premier League
  league_season: 2026

_salah_goal: &salah_goal
  type: Goal
  detail: Normal Goal
  team_id: 40
  team_name: Liverpool
  player_id: 111
  player_name: Salah
  minute: 30

_nunez_goal: &nunez_goal
  type: Goal
  detail: Normal Goal
  team_id: 40
  team_name: Liverpool
  player_id: 222
  player_name: Nunez
  minute: 40

cycles:
  # Cycle 1: only Salah's goal. INSERT event A (count=1).
  - t: 2026-07-08T15:30:00Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*salah_goal]

  # Cycle 2: Salah still there, Nunez scores.
  # count_A=2, INSERT event B (count=1)
  - t: 2026-07-08T15:40:30Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*salah_goal, *nunez_goal]

  # Cycle 3: both present. count_A=3 (TRIGGERS!), count_B=2
  - t: 2026-07-08T15:41:00Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*salah_goal, *nunez_goal]

  # Cycle 4: Salah goal VAR'd, Nunez still present.
  # count_A=2 (absent), count_B=3 (TRIGGERS!)
  - t: 2026-07-08T15:41:30Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*nunez_goal]

  # Cycle 5: Salah still absent, Nunez still present.
  # count_A=1, count_B=3 (capped, no retrigger)
  - t: 2026-07-08T15:42:00Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*nunez_goal]

  # Cycle 6: Salah RECOVERS (glitch resolved). count_A=2, count_B=3
  - t: 2026-07-08T15:42:30Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*salah_goal, *nunez_goal]

  # Cycle 7: both still present. count_A=3 (NO retrigger — already
  # was true), count_B=3
  - t: 2026-07-08T15:43:00Z
    api_responses:
      fixtures_by_ids:
        fixtures:
          - <<: *base_fixture
            events: [*salah_goal, *nunez_goal]

expected_final_state:
  events:
    - fixture_id: 999004
      natural_key: "40_111_Goal_1"    # Salah's goal
      debounce_count: 3
      downstream_triggered: true      # triggered at cycle 3
      removed: false                  # recovered before hitting zero
    - fixture_id: 999004
      natural_key: "40_222_Goal_1"    # Nunez's goal
      debounce_count: 3
      downstream_triggered: true      # triggered at cycle 4
      removed: false
  counts:
    events: 2
