name: debounce-removed-reappearance-generation
description: |
  A removed event generation remains immutable history but cannot suppress
  equivalent provider evidence forever. The original goal appears once and is
  removed on its absence vote. When it returns, reconciliation allocates the
  next sequence, starts a fresh debounce, and triggers downstream after three
  observations.

  Trace: `_goal_1` appears cycle 1 and is removed cycle 2. The same provider
  event returns in cycles 3-5 as `_goal_2`, whose count climbs 1→2→3. Both rows
  remain: generation 1 is the VAR audit tombstone; generation 2 is active.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999005
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1h"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

_goal_present: &goal_present
  fixtures:
    - id: 999005
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      goals_home: 1
      goals_away: 0
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

_goal_absent: &goal_absent
  fixtures:
    - id: 999005
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 31
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      goals_home: 0
      goals_away: 0
      events: []

cycles:
  # Generation 1 appears, then receives an unprotected absence vote and is
  # preserved as a removed tombstone.
  - t: 2026-07-08T15:30:00Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:30:30Z
    api_responses: {fixtures_by_ids: *goal_absent}

  # Equivalent provider evidence now allocates generation 2 and follows the
  # ordinary three-observation trigger path.
  - t: 2026-07-08T15:31:00Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:31:30Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:32:00Z
    api_responses: {fixtures_by_ids: *goal_present}

expected_final_state:
  events:
    - fixture_id: 999005
      natural_key: "40_111_goal_1"
      debounce_count: 0
      downstream_triggered: false
      removed: true
      removed_reason: var
    - fixture_id: 999005
      natural_key: "40_111_goal_2"
      debounce_count: 3
      downstream_triggered: true
      removed: false
  counts:
    events: 2
    event_monitor_workflows: 4
    event_drop_workflows: 1
