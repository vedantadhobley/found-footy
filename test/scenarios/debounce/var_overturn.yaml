name: debounce-var-overturn
description: |
  Full 3-poll debounce trigger + 3-consecutive-absence hit-zero cycle.
  Goal detected cycles 1-2-3 (count 1→2→3, triggers downstream).
  VAR overturn cycles 4-5-6 (count 3→2→1→0, hit-zero soft-deletes
  with removed_reason=var).
  Verifies the symmetric-counter debounce model end-to-end.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999001
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1h"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

# YAML anchors — the fixture envelope is stable across cycles; only
# the events array changes. Anchor once, merge into each cycle.
_goal_present: &goal_present
  fixtures:
    - id: 999001
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

_goal_absent: &goal_absent
  fixtures:
    - id: 999001
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 32
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events: []

cycles:
  # Cycle 1 — goal appears. INSERT event, seeds debounce_count=1.
  - t: 2026-07-08T15:30:00Z
    api_responses:
      fixtures_by_ids: *goal_present

  # Cycle 2 — goal still present. RegisterEventPresence(w2), count=2.
  - t: 2026-07-08T15:30:30Z
    api_responses:
      fixtures_by_ids: *goal_present

  # Cycle 3 — goal still present. RegisterEventPresence(w3), count=3,
  # justTriggered=true. downstream_triggered flips FALSE→TRUE.
  - t: 2026-07-08T15:31:00Z
    api_responses:
      fixtures_by_ids: *goal_present

  # Cycle 4 — VAR overturn: goal absent from API.
  # RegisterEventAbsence(w4), count=2.
  - t: 2026-07-08T15:31:30Z
    api_responses:
      fixtures_by_ids: *goal_absent

  # Cycle 5 — still absent. count=1.
  - t: 2026-07-08T15:32:00Z
    api_responses:
      fixtures_by_ids: *goal_absent

  # Cycle 6 — third consecutive absence. count=0, hitZero, soft-delete
  # with removed_reason=var atomic.
  - t: 2026-07-08T15:32:30Z
    api_responses:
      fixtures_by_ids: *goal_absent

expected_final_state:
  events:
    - fixture_id: 999001
      natural_key: "40_111_goal_1"
      debounce_count: 0
      downstream_triggered: true
      removed: true
      removed_reason: var
  counts:
    events: 1
    event_monitor_workflows: 3   # w1 (via Insert) + w2 + w3
    event_drop_workflows: 3      # w4 + w5 + w6
