name: debounce-flicker-no-reset
description: |
  The symmetric counter's DIFFERENTIATOR vs Python's asymmetric model:
  presence votes decrement toward the trigger, but they do NOT reset
  the counter to full capacity on each cycle. Python's model would
  set drop_count back to 0 on any presence; ours moves it by ±1.

  Trace: goal appears cycles 1-3 (triggers at count=3), absent cycle 4
  (count=2), present cycle 5 (count=3, NO retrigger), absent cycle 6
  (count=2), present cycle 7 (count=3).

  Expected: after 7 cycles, event is stable at count=3 with
  downstream_triggered=true and NOT removed. The debounce budget
  never hit zero. But 4 presence votes + 2 absence votes were
  recorded — showing every distinct workflow_id got its say.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999002
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1H"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

_goal_present: &goal_present
  fixtures:
    - id: 999002
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

_goal_absent: &goal_absent
  fixtures:
    - id: 999002
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 32
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events: []

cycles:
  # Cycles 1-2-3: goal present, count 1→2→3, triggers downstream
  - t: 2026-07-08T15:30:00Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:30:30Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:31:00Z
    api_responses: {fixtures_by_ids: *goal_present}

  # Cycle 4: goal absent, count 3→2
  - t: 2026-07-08T15:31:30Z
    api_responses: {fixtures_by_ids: *goal_absent}

  # Cycle 5: goal reappears, count 2→3 (capped at 3, NO retrigger)
  - t: 2026-07-08T15:32:00Z
    api_responses: {fixtures_by_ids: *goal_present}

  # Cycle 6: absent again, count 3→2
  - t: 2026-07-08T15:32:30Z
    api_responses: {fixtures_by_ids: *goal_absent}

  # Cycle 7: present again, count 2→3
  - t: 2026-07-08T15:33:00Z
    api_responses: {fixtures_by_ids: *goal_present}

expected_final_state:
  events:
    - fixture_id: 999002
      natural_key: "40_111_Goal_1"
      debounce_count: 3
      downstream_triggered: true
      removed: false
  counts:
    events: 1
    # 5 distinct presence-voting workflows: Insert (cycle 1) + cycles 2, 3, 5, 7
    event_monitor_workflows: 5
    # 2 distinct absence-voting workflows: cycles 4, 6
    event_drop_workflows: 2
