name: ingest-manual-ids
description: |
  Manual re-ingest via ManualFixtureIDs bypasses the window path and
  hits /fixtures?ids= instead. Verifies:
    - runner dispatches to FetchFixturesByIDs activity, not
      FetchFixturesForWindow
    - mock serves the by-IDs endpoint variant
    - resulting fixture lands normally as staging

workflow: IngestWorkflow

ingest_input:
  manual_date: 2026-07-07T00:05:00Z
  manual_fixture_ids: [1515514]
  activation_window: 30m
  retention_days: 14

api_responses:
  fixtures_by_ids:
    fixtures:
      - id: 1515514
        kickoff: 2026-07-10T15:00:00Z
        status_short: NS
        status_long: Not Started
        home_id: 40
        home_name: Liverpool
        away_id: 42
        away_name: Arsenal
        league_id: 39
        league_name: Premier League
        league_season: 2026

expected_final_state:
  fixtures:
    - id: 1515514
      state: staging
      api_status_short: ns
      has_activated_at: false
      has_completed_at: false
      has_last_polled_at: true
  team_aliases:
    - team_id: 40
      team_name: Liverpool
    - team_id: 42
      team_name: Arsenal
  counts:
    fixtures: 1
    team_aliases: 2
