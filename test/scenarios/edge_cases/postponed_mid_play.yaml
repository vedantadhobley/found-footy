name: edge-postponed-mid-play
description: |
  Match goes PST mid-play (weather delay, floodlight failure).
  Verifies our SUSP/INT/PST=active decision from decisions.md
  2026-07-07 works end-to-end: fixture stays state=active,
  monitor keeps polling, events survive because the API keeps
  the events array cumulative through the pause.

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999009
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1H"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

_goal_present: &goal_present
  fixtures:
    - id: 999009
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

_postponed: &postponed
  fixtures:
    - id: 999009
      kickoff: 2026-07-08T15:00:00Z
      status_short: PST
      status_long: Match Postponed
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      # API keeps cumulative events through the pause — the goal
      # scored before the postponement stays visible.
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

cycles:
  # Cycles 1-2-3: goal detected + debounced + triggered
  - t: 2026-07-08T15:30:00Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:30:30Z
    api_responses: {fixtures_by_ids: *goal_present}
  - t: 2026-07-08T15:31:00Z
    api_responses: {fixtures_by_ids: *goal_present}

  # Cycles 4-5-6: PST — empty events array from API.
  # Does our reconcile falsely vote absence? Test tells us.
  - t: 2026-07-08T15:31:30Z
    api_responses: {fixtures_by_ids: *postponed}
  - t: 2026-07-08T15:32:00Z
    api_responses: {fixtures_by_ids: *postponed}
  - t: 2026-07-08T15:32:30Z
    api_responses: {fixtures_by_ids: *postponed}

  # Cycle 7: resume
  - t: 2026-07-08T15:33:00Z
    api_responses: {fixtures_by_ids: *goal_present}

expected_final_state:
  fixtures:
    - id: 999009
      state: active                # never changed state
      api_status_short: "1H"        # cycle 7 refreshed to 1H
      has_activated_at: true
      has_completed_at: false
      has_last_polled_at: true
  events:
    - fixture_id: 999009
      natural_key: "40_111_Goal_1"
      debounce_count: 3            # optimistic: PST doesn't burn budget
      downstream_triggered: true
      removed: false               # goal preserved through pause
