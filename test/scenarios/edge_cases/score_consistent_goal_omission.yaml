name: edge-score-consistent-goal-omission
description: |
  Regression for FF-014 and the Lazio-Mantova production failure. Two away
  goals debounce to stable. The provider then omits the second goal element
  for three terminal polls while retaining the 0-2 aggregate score.

  The score proves that the event array is incomplete, so the stored second
  goal receives no absence votes, is not classified as VAR, and remains in
  the completion inventory. Score parity remains audit evidence rather than a
  permanent gate. The fixture completes one hour after the first uninterrupted
  terminal observation once the event and downstream gates are settled.

