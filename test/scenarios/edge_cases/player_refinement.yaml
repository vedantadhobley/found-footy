name: edge-player-refinement
description: |
  Real behavior: the API sometimes reports a goal without knowing the
  scorer (player_id=null), then refines it once the scorer is
  identified. ComposeNaturalKey uses "unknown" for a null player_id:
    Unknown scorer → "40_unknown_goal_1"
    Known scorer   → "40_111_goal_1"

  These are DIFFERENT natural_keys, so a refinement looks like: the
  unknown-scorer key disappears and the known-scorer key appears.

  Behavior (Python parity — monitor.py initial_count=0 +
  unknown_scorer_disappeared; see decisions.md unknown-scorer entry):
  an unknown-scorer goal is "not a full event yet" — it lands as a
  PLACEHOLDER pinned at debounce_count=0, casts no presence vote, and
  never spawns a search (there's no player to query Twitter for). The
  moment it disappears (replaced by the real scorer) it is
  HARD-DELETED — no VAR soft-delete, no gradual decay. Only the
  known-scorer event debounces up (0→…) and triggers.

  Assertion: exactly ONE event survives — the known-scorer row,
  debounced to 3 and triggered. The unknown placeholder leaves no
  row (hard-deleted at the refinement cycle).

workflow: MonitorWorkflow

setup:
  fixtures:
    - id: 999013
      state: active
      kickoff: 2026-07-08T15:00:00Z
      activated_at: 2026-07-08T14:45:00Z
      last_polled_at: 2026-07-08T15:29:30Z
      api_status_short: "1h"
      api_status_long: First Half
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026

_unknown_scorer: &unknown_scorer
  fixtures:
    - id: 999013
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          # player_id: null (omitted)
          minute: 30

_known_scorer: &known_scorer
  fixtures:
    - id: 999013
      kickoff: 2026-07-08T15:00:00Z
      status_short: "1H"
      status_long: First Half
      status_elapsed: 30
      home_id: 40
      home_name: Liverpool
      away_id: 42
      away_name: Arsenal
      league_id: 39
      league_name: Premier League
      league_season: 2026
      events:
        - type: Goal
          detail: Normal Goal
          team_id: 40
          team_name: Liverpool
          player_id: 111
          player_name: Salah
          minute: 30

cycles:
  # Cycle 1: unknown scorer → INSERT 40_unknown_goal_1 as a placeholder
  # (debounce_count=0, no vote).
  - t: 2026-07-08T15:30:00Z
    api_responses: {fixtures_by_ids: *unknown_scorer}

  # Cycle 2: unknown scorer still present → placeholder pinned at 0
  # (matching branch skips the presence vote).
  - t: 2026-07-08T15:30:30Z
    api_responses: {fixtures_by_ids: *unknown_scorer}

  # Cycle 3: player identified! natural_key becomes 40_111_goal_1.
  # Reconcile sees:
  #   - "40_unknown_goal_1" NOT in API → placeholder → HARD-DELETED
  #   - "40_111_goal_1" NEW → INSERT known scorer (count=1)
  - t: 2026-07-08T15:31:00Z
    api_responses: {fixtures_by_ids: *known_scorer}

  # Cycles 4-5: known scorer persists → debounces 2, then 3 (TRIGGERS).
  - t: 2026-07-08T15:31:30Z
    api_responses: {fixtures_by_ids: *known_scorer}
  - t: 2026-07-08T15:32:00Z
    api_responses: {fixtures_by_ids: *known_scorer}

expected_final_state:
  events:
    # Only the known-scorer row survives. The unknown placeholder was
    # pinned at 0 (never voted) and hard-deleted the cycle it disappeared
    # (cycle 3), so it leaves no row at all.
    # Known-scorer row: cycle 3 INSERT (1) → cycle 4 (2) → cycle 5 (3, TRIGGERS)
    - fixture_id: 999013
      natural_key: "40_111_goal_1"
      debounce_count: 3
      downstream_triggered: true
      removed: false
  counts:
    events: 1
