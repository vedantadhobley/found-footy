# Garage config — single-node S3 blob storage for found-footy (dev + prod).
#
# ONE config for both environments: the structure is identical, and the three
# secrets (rpc_secret, admin_token, metrics_token) are injected via GARAGE_*
# env vars from the gitignored .env — so no secrets live in git and there is no
# per-env file duplication. Garage reads GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN
# / GARAGE_METRICS_TOKEN when the TOML keys are absent (garage >= v0.8.2).
#
# Per-instance cluster bootstrap (layout -> bucket -> key) is a one-time step —
# see docs/deployment.md section Garage. Reprovision a cluster with
# `docker volume rm <project>_garage-{data,meta}`.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

replication_factor = 1        # single-node on luv; no replication
db_engine = "sqlite"

# RPC — internal cluster comms. Single-node, so inert (no peers). The secret
# comes from GARAGE_RPC_SECRET (.env), not an inline key.
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

# S3 API — what the worker/api connect to at http://garage:3900.
[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
root_domain = ".s3.garage.local"

# Admin API — bucket + key management (internal only, :3903). admin_token +
# metrics_token come from GARAGE_ADMIN_TOKEN / GARAGE_METRICS_TOKEN (.env).
[admin]
api_bind_addr = "[::]:3903"
