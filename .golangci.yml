# golangci-lint v2 policy for the Git-visible Go modules.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck      # unchecked error returns
    - gosec         # security-oriented checks
    - govet         # standard-library static analysis
    - ineffassign   # useless assignments
    - misspell      # typos in comments and strings
    - staticcheck   # broad correctness checks
    - unconvert     # unnecessary type conversions
    - unused        # unreachable declarations
  settings:
    gosec:
      excludes:
        - G104  # errcheck owns ignored-error reporting
    misspell:
      locale: US
      # API-Football's provider vocabulary uses the British wire spelling.
      ignore-rules:
        - cancelled
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may intentionally ignore cleanup errors and use fixture secrets.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
    paths:
      - vendor
      - migrations

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - migrations
