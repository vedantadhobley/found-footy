run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck      # unchecked error returns
    - govet         # stdlib go vet
    - ineffassign   # useless assignments
    - staticcheck   # comprehensive correctness checks
    - unused        # unused code
    - gofmt         # standard formatting
    - goimports     # import ordering + unused
    - misspell      # typos in comments + strings
    - revive        # replacement for the deprecated golint
    - unconvert     # unnecessary type conversions
    - gosec         # security-oriented checks

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
      - name: package-comments
      - name: var-naming
  misspell:
    locale: US
  gosec:
    excludes:
      # These fire aggressively during scaffolding; revisit when real code lands.
      - G104  # unhandled errors — errcheck covers this more precisely

issues:
  exclude-dirs:
    - archive
    - vendor
    - migrations
  exclude-rules:
    # Test files can skip some strict checks.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # doc.go files are empty by design during Phase F.
    - path: doc\.go
      linters:
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
