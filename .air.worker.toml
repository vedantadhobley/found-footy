# air config for the worker binary. See https://github.com/air-verse/air.
# Watches /src, rebuilds cmd/worker on .go changes, restarts the running
# process in-container. Zero action required on the host — save the
# file, wait ~2 seconds, new code is running.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/worker ./cmd/worker"
  bin = "./tmp/worker"
  include_ext = ["go"]
  exclude_dir = ["archive", "tmp", "migrations", ".git", ".claude", "docs", "caddy"]
  delay = 500  # ms after last change before rebuild triggers
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
