# Development deployment for the removable Found Footy operator UI only.
name: found-footy-dev-ui

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: found-footy-operator-ui:dev
    container_name: found-footy-dev-ui
    mem_limit: 256m
    environment:
      OPERATOR_UI_ENV: dev
      OPERATOR_UI_HTTP_ADDR: :8080
      OPERATOR_UI_POLL_INTERVAL: 2s
      OPERATOR_UI_RESYNC_INTERVAL: 30s
      OPERATOR_UI_PG_MAX_CONNS: "4"
      PG_DSN: ${PG_DSN:?PG_DSN is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - found-footy-dev
      - proxy
    restart: unless-stopped

networks:
  found-footy-dev:
    external: true
  proxy:
    external: true
